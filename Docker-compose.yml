version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: mysql-pets
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass          # contraseña root (cámbiala en producción)
      MYSQL_DATABASE: pets                   # nombre de la BD que se crea automáticamente
      MYSQL_USER: appuser                    # usuario normal para tu app
      MYSQL_PASSWORD: apppass                # contraseña del usuario app
    ports:
      - "3307:3306"                          # mapeamos 3307 en localhost → evita conflicto con MySQL local si lo tienes
    volumes:
      - mysql-data:/var/lib/mysql            # persistencia de datos
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .                                 # construye desde tu Dockerfile
    container_name: spring-pets
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/pets?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update    # o validate/create si prefieres
      SPRING_JPA_SHOW_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
    depends_on:
      db:
        condition: service_healthy           # espera a que MySQL esté realmente listo

volumes:
  mysql-data: